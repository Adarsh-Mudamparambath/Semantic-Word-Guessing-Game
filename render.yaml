services:
  - type: web
    name: semantic-word-game-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      cd backend && pip install --no-cache-dir -r requirements.txt
    startCommand: |
      cd backend && python ../scripts/seed_database.py && python scripts/precompute_embeddings.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # pydantic-core 2.23.4 ships prebuilt wheels for Python 3.12.
      # Pinning avoids Render's newer default Python 3.14 runtime.
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: semantic-word-game-db
          property: connectionString
      - key: SCORING_BACKEND
        value: sentence_transformers
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GUESS_RATE_LIMIT_PER_MINUTE
        value: "30"

databases:
  - name: semantic-word-game-db
    region: oregon
    plan: free
    databaseName: semantic_word_game
    user: semantic_word_game
